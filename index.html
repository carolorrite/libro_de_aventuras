<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno de Viaje</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            overflow:hidden;
            background:#d7c3a3;
            font-family:'Caveat', cursive;
        }

        #introVideo{
            position:fixed;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:999;
            background:black;
            transition:opacity 2s ease;
        }

        #mainContentWrapper{
            opacity:0;
            pointer-events:none;
            transition:2s;
        }

        #mainContentWrapper.show{
            opacity:1;
            pointer-events:all;
        }

        .dark{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.15);
            z-index:-1;
        }

        .book-page{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            width:72%;
            height:82%;
            background:#f7f0df;
            border-radius:10px;
            padding:50px;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 0 50px rgba(0,0,0,0.08);
        }

        .title{
            font-size:3.2rem;
            color:#4e342e;
            line-height:1.3;
            max-width:900px;
            min-height:150px;
        }

        .word{
            display:inline-block;
            opacity:0;
            transform:translateY(10px);
            animation:writeWord 0.4s forwards;
            margin-right:12px;
        }

        @keyframes writeWord{
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .destinations{
            margin-top:50px;
            display:flex;
            gap:30px;
            flex-wrap:wrap;
            opacity:0;
            animation:fadeIn 1s ease forwards;
            animation-delay:2.5s;
        }

        @keyframes fadeIn{
            to{ opacity:1; }
        }

        .destination-container{
            position:relative;
            padding-top:15px;
        }

        .tape{
            position:absolute;
            top:5px;
            left:50%;
            transform:translateX(-50%) rotate(-2deg);
            width:60px;
            height:20px;
            background:rgba(216, 185, 138, 0.5);
            box-shadow:inset 0 0 5px rgba(0,0,0,0.05);
            z-index:2;
            border-left:2px dotted rgba(0,0,0,0.1);
            border-right:2px dotted rgba(0,0,0,0.1);
        }

        .destination{
            position:relative;
            padding:15px 30px;
            background:#d8b98a;
            border:2px dashed #8d6e63;
            cursor:pointer;
            font-size:2.2rem;
            color:#4e342e;
            transition:0.3s;
            box-shadow:4px 4px 10px rgba(0,0,0,0.15);
            z-index:1;
        }

        .dest-1{ transform:rotate(-2deg); }
        .dest-2{ transform:rotate(1deg); }
        .dest-3{ transform:rotate(-1.5deg); }

        .destination:hover{
            transform:scale(1.05) translateY(-5px);
            background:#e6c79a;
        }

        .map-screen{
            position:absolute;
            inset:0;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:#f7f0df;
            opacity:0;
            pointer-events:none;
            transition:1s;
            padding:15px;
        }

        .map-screen.active{
            opacity:1;
            pointer-events:all;
        }

        .map-title{
            font-size:3rem;
            margin-bottom:10px;
            color:#5d4037;
        }

        .map-wrapper{
            position:relative;
            width:90%;
            max-width:950px;
        }

        .map-image{
            width:100%;
            max-height:65vh;
            object-fit:contain;
            border:10px solid white;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .pin{
            position:absolute;
            width:22px;
            height:22px;
            border-radius:50%;
            background:#c62828;
            border:3px solid white;
            cursor:pointer;
            animation:pulse 2s infinite;
            transform:translate(-50%, -50%);
        }

        @keyframes pulse{
            0%{ transform:translate(-50%, -50%) scale(1); }
            50%{ transform:translate(-50%, -50%) scale(1.3); }
            100%{ transform:translate(-50%, -50%) scale(1); }
        }

        .photo-popup{
            position:absolute;
            top:5%;
            right:-60px;
            background:white;
            padding:12px;
            width:230px;
            box-shadow:0 10px 30px rgba(0,0,0,0.35);
            transform:rotate(4deg) scale(0);
            transition:0.4s;
        }

        .photo-popup.active{
            transform:rotate(4deg) scale(1);
        }

        .photo-popup img{ width:100%; }

        .photo-caption{
            text-align:center;
            margin-top:10px;
            font-size:1.6rem;
            color:#5d4037;
        }

        .back{
            margin-top:15px;
            padding:10px 22px;
            border:none;
            background:#8d6e63;
            color:white;
            font-size:1.4rem;
            cursor:pointer;
            border-radius:10px;
        }
    </style>
</head>

<body>

<!-- AUDIO -->
<audio id="bgMusic" loop>
    <source src="musica.mp4" type="audio/mp4">
</audio>

<!-- INTRO -->
<video id="introVideo" autoplay muted playsinline>
    <source src="libro-abriendose.mp4" type="video/mp4">
</video>

<div id="mainContentWrapper">

    <div class="dark"></div>

    <div class="book-page">

        <div id="mainContent">
            <div class="title" id="handwrittenText"></div>

            <div class="destinations">
                <div class="destination-container">
                    <div class="tape"></div>
                    <div class="destination dest-1" onclick="openMap('Australia 2019')">
                        🦘 Australia 2019
                    </div>
                </div>

                <div class="destination-container">
                    <div class="tape"></div>
                    <div class="destination dest-2" onclick="openMap('Costa Rica 2024')">
                        🌿 Costa Rica 2024
                    </div>
                </div>

                <div class="destination-container">
                    <div class="tape"></div>
                    <div class="destination dest-3" onclick="openMap('Egipto 2025')">
                        🏺 Egipto 2025
                    </div>
                </div>
            </div>
        </div>

        <div class="map-screen" id="mapScreen">
            <div class="map-title" id="mapTitle"></div>
            <div class="map-wrapper">
                <img class="map-image" id="mapImage">
                <div id="pins"></div>

                <div class="photo-popup" id="photoPopup">
                    <img id="popupImage">
                    <div class="photo-caption" id="photoCaption"></div>
                </div>
            </div>

            <button class="back" onclick="goBack()">Volver</button>
        </div>

    </div>

</div>

<script>

const introVideo = document.getElementById("introVideo");
const mainWrapper = document.getElementById("mainContentWrapper");
const bgMusic = document.getElementById("bgMusic");

bgMusic.volume = 0.4;

function tryPlayMusic(){
    const p = bgMusic.play();
    if(p !== undefined){
        p.catch(()=>console.log("bloqueado"));
    }
}

// 🎬 AL TERMINAR INTRO
introVideo.onended = () => {

    introVideo.style.opacity = "0";

    setTimeout(() => {

        introVideo.style.display = "none";
        mainWrapper.classList.add("show");
        startWriting();

        tryPlayMusic(); // 🎵 AQUÍ EMPIEZA LA MÚSICA

    }, 2000);
};

function startWriting(){
    const text = "Bienvenido al cuaderno de viaje de Carlos y Carol. ¿A dónde quieres ir hoy?";
    const container = document.getElementById("handwrittenText");

    container.innerHTML = "";

    text.split(" ").forEach((word,i)=>{
        const span = document.createElement("span");
        span.className = "word";
        span.innerText = word;
        span.style.animationDelay = (i*0.2)+"s";
        container.appendChild(span);
    });
}

const destinations = {
    "Australia 2019":{
        map:"Australia.jpg",
        pins:[
            {x:"76%",y:"71%",image:"sydney.jpg",title:"Sydney"},
            {x:"69%",y:"29%",image:"cairns.jpg",title:"Cairns"},
            {x:"72%",y:"47%",image:"whitsundays.jpg",title:"Whitsundays"},
            {x:"73%",y:"54%",image:"capehillsborough.jpg",title:"Cape Hillsborough"}
        ]
    },

    "Costa Rica 2024":{
        map:"costarica.jpg",
        pins:[
            {x:"35%",y:"45%",image:"pacifico.jpg",title:"Pacífico"},
            {x:"52%",y:"52%",image:"sanjose.jpg",title:"San José"},
            {x:"85%",y:"58%",image:"puertoviejo.jpg",title:"Cahuita"}
        ]
    },

    "Egipto 2025":{
        map:"egipto.jpg",
        pins:[
            {x:"63%",y:"38%",image:"cairo.jpg",title:"El Cairo"},
            {x:"56%",y:"40%",image:"pyramids.jpg",title:"Pirámides"},
            {x:"62%",y:"70%",image:"luxor.jpg",title:"Luxor"},
            {x:"69%",y:"83%",image:"aswan.jpg",title:"Aswan"},
            {x:"58%",y:"88%",image:"abusimbel.jpg",title:"Abu Simbel"}
        ]
    }
};

function openMap(name){
    const data = destinations[name];
    document.getElementById("mapTitle").innerText = name;
    document.getElementById("mapImage").src = data.map;
    document.getElementById("mapScreen").classList.add("active");
    createPins(data.pins);
}

function createPins(pins){
    const container = document.getElementById("pins");
    container.innerHTML = "";

    pins.forEach(p=>{
        const d = document.createElement("div");
        d.className="pin";
        d.style.left=p.x;
        d.style.top=p.y;

        d.onclick = (e)=>{
            e.stopPropagation();
            document.getElementById("popupImage").src=p.image;
            document.getElementById("photoCaption").innerText=p.title;
            document.getElementById("photoPopup").classList.add("active");
        };

        container.appendChild(d);
    });
}

function goBack(){
    document.getElementById("mapScreen").classList.remove("active");
    document.getElementById("photoPopup").classList.remove("active");
}

document.getElementById("mapScreen").onclick = () => {
    document.getElementById("photoPopup").classList.remove("active");
};

</script>

</body>
</html>
